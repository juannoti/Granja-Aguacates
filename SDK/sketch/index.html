<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sketch</title>
    <script type="module" src="main.js" defer></script>

    <script
      type="module"
      src="https://js.arcgis.com/calcite-components/3.3.3/calcite.esm.js"
    ></script>

    <script src="https://js.arcgis.com/4.34/"></script>

    <script
      type="module"
      src="https://js.arcgis.com/4.34/map-components/"
    ></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #viewDiv {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <arcgis-map basemap="dark-gray">
      <arcgis-sketch
        slot="bottom-right"
        creation-mode="continuous"
        layout="horizontal"
        hide-create-tools-circle
        hide-create-tools-multipoint
        hide-create-tools-polygon
        hide-create-tools-polyline
        hide-create-tools-rectangle
      ></arcgis-sketch
    ></arcgis-map>
  </body>
</html>
