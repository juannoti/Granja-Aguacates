<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escena</title>
    <script type="module" src="main.js" defer></script>
    <script
      type="module"
      src="https://js.arcgis.com/calcite-components/3.3.3/calcite.esm.js"
    ></script>

    <script src="https://js.arcgis.com/4.34/"></script>

    <script
      type="module"
      src="https://js.arcgis.com/4.34/map-components/"
    ></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #viewDiv {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <arcgis-scene
      basemap="topo-vector"
      camera-position="-3.7, 40.42, 500"
      camera-tilt="85"
      camera-heading="340"
      ><arcgis-zoom slot="top-left"></arcgis-zoom>
      <arcgis-navigation-toggle slot="top-left"></arcgis-navigation-toggle>
      <arcgis-compass slot="top-left"></arcgis-compass>
      </arcgis-scene>
    <div id="viewDiv">
      <button class="boton1">Vista 1</button>
      <button class="boton2">Vista 2</button>
      <button class="boton3">Vista 3</button>
      <button class="boton4">Vista 4</button>
    </div>
  </body>
</html>
